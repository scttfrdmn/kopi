plugins {
    id 'java-library'
    id 'jacoco'
}

// Published artifact name: dev.burstcore:kopi (not kopi-java)
base.archivesName = 'kopi'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.26.27')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:ecs'
    implementation 'software.amazon.awssdk:ec2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Forward BURST_INTEGRATION_TEST system property to test JVM
    systemProperty 'BURST_INTEGRATION_TEST', System.getProperty('BURST_INTEGRATION_TEST', '')
    // Forward AWS env vars for integration tests
    environment 'AWS_ENDPOINT_URL', System.getenv('AWS_ENDPOINT_URL') ?: ''
    environment 'AWS_ACCESS_KEY_ID', System.getenv('AWS_ACCESS_KEY_ID') ?: ''
    environment 'AWS_SECRET_ACCESS_KEY', System.getenv('AWS_SECRET_ACCESS_KEY') ?: ''
    environment 'AWS_DEFAULT_REGION', System.getenv('AWS_DEFAULT_REGION') ?: ''
    environment 'BURST_CONFIG_PATH', System.getenv('BURST_CONFIG_PATH') ?: ''
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}
