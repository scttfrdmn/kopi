name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - uses: codecov/codecov-action@v5
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: go install github.com/scttfrdmn/substrate/cmd/substrate@latest
      - run: substrate server --address :4566 &
        shell: bash
      - name: Wait for substrate
        run: for i in $(seq 1 20); do curl -sf http://localhost:4566/health && break; sleep 1; done
      - run: ./gradlew test -DBURST_INTEGRATION_TEST=1 --rerun-tasks
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
