plugins {
    id 'scala'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':kopi-java')
    implementation 'org.scala-lang:scala3-library_3:3.4.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'io.circe:circe-core_3:0.14.9'
    implementation 'io.circe:circe-generic_3:0.14.9'
    implementation 'io.circe:circe-parser_3:0.14.9'
    testImplementation 'org.scalatest:scalatest_3:3.2.18'
    testImplementation 'org.junit.platform:junit-platform-engine:1.10.2'
    testRuntimeOnly 'co.helmethair:scalatest-junit-runner:0.2.0'
}

// ScalaTest requires JUnit platform
test {
    useJUnitPlatform()
}
